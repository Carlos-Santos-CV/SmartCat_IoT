services:
  db:
    image: postgres:15-alpine
    container_name: smartcat_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartcat_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-smartcat_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - smartcat_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartcat_user} -d ${POSTGRES_DB:-smartcat_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Sem 'ports:' aqui de propósito: publicar 5432 é conveniência de dev,
    # definida em docker-compose.override.yml. Em prod fica só na rede interna.

  broker:
    image: eclipse-mosquitto:2
    container_name: smartcat_broker
    restart: unless-stopped
    ports:
      - "1883:1883"   # público nos dois ambientes: o firmware do ESP32 precisa alcançar em dev e prod
    volumes:
      - ./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - smartcat_net

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: smartcat_web:latest
    container_name: smartcat_app
    restart: unless-stopped
    # Comando padrão = produção (sem --reload). O override de dev troca isso.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-smartcat_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-smartcat_db}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_CLAIM_EMAIL=${VAPID_CLAIM_EMAIL:-mailto:contato@smartcat.local}
    networks:
      - smartcat_net
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_started
    # Sem bind-mount e sem 'ports:' aqui: roda a imagem buildada, sem hot-reload.
    # Ambos entram via docker-compose.override.yml (dev).

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: smartcat_web:latest   # mesma imagem do web, reaproveitada
    container_name: smartcat_worker
    restart: unless-stopped
    command: python -m app.worker
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-smartcat_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-smartcat_db}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_CLAIM_EMAIL=${VAPID_CLAIM_EMAIL:-mailto:contato@smartcat.local}
    networks:
      - smartcat_net
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_started

networks:
  smartcat_net:
    driver: bridge

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
