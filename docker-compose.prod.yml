# Carregado EXPLICITAMENTE em produção:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Sem --env-file: o Compose já lê o arquivo ".env" na raiz do projeto
# automaticamente (POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB). Veja
# ".env.example" na raiz para o template. As chaves VAPID e demais
# configs da aplicação NÃO ficam aqui — ficam só em backend/.env
# (lido via env_file: no docker-compose.yml), pra evitar que o mesmo
# valor fique declarado em dois lugares e diverja silenciosamente.
#
# Não redefine nada do docker-compose.yml (web/db já nascem sem porta publicada
# e sem bind-mount na base) — só ADICIONA o serviço do Caddy, que não existe
# nem na base nem no override de dev.
services:
  caddy:
    image: caddy:2-alpine
    container_name: smartcat_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - smartcat_net
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
