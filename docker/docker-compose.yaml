services:
  db:
    image: postgres:15-alpine
    container_name: smartcat_db
    restart: always
    environment:
      POSTGRES_USER: smartcat_user
      POSTGRES_PASSWORD: smartcat_password
      POSTGRES_DB: smartcat_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcat_user -d smartcat_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  broker:
    image: eclipse-mosquitto:2
    container_name: smartcat_broker
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf

  web:
      build:
        context: ../backend
        dockerfile: Dockerfile
      container_name: smartcat_app
      restart: always
      ports:
        - "8000:8000"
      environment:
        - DATABASE_URL=postgresql://smartcat_user:smartcat_password@db:5432/smartcat_db
        - MQTT_BROKER=broker.hivemq.com
        - MQTT_PORT=1883
        # Notificações Web Push (Alertas de Saúde) — gere com scripts/generate_vapid_keys.py
        # e defina os valores em docker/.env (veja docker/.env.example)
        - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
        - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
        - VAPID_CLAIM_EMAIL=${VAPID_CLAIM_EMAIL:-mailto:contato@smartcat.local}
      volumes:
        - ../backend:/app
      depends_on:
        db:
          condition: service_healthy
        broker:
          condition: service_started

volumes:
  postgres_data: