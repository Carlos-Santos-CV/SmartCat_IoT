[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

lib_deps = 
    bblanchon/ArduinoJson @ ^6.21.3
    knolleary/PubSubClient @ ^2.8
    miguelbalboa/MFRC522 @ ^1.4.10

# ===========================================
# Configurações por Ambiente
# ===========================================

# Ambiente de Desenvolvimento (Wokwi Simulator)
[env:dev]
extends = env:esp32-s3-devkitc-1
build_flags = 
    -D WIFI_SSID=\"Wokwi-GUEST\"
    -D WIFI_PASSWORD=\"\"
    -D MQTT_BROKER=\"broker.hivemq.com\"
    -D MQTT_PORT=1883

# Ambiente de Produção (Hardware Físico)
# Copie este bloco para [env:prod] e ajuste as credenciais
[env:prod]
extends = env:esp32-s3-devkitc-1
build_flags = 
    -D WIFI_SSID=\"CarlosSantos\"
    -D WIFI_PASSWORD=\"brasileiro2024\"
    -D MQTT_BROKER=\"34.95.195.6\"
    -D MQTT_PORT=1883    

# ===========================================
# Como usar:
# ===========================================
# Desenvolvimento (Wokwi):
#   pio run -e dev
#   ou no VSCode: selecione "dev" na barra inferior
#
# Produção (ESP32 físico):
#   1. Edite as credenciais acima em [env:prod]
#   2. pio run -e prod --target upload
#
# Dica: Crie um platformio.local.ini (não versionado) com suas credenciais
# reais para não expor senhas no repositório.