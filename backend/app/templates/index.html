<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SmartCat PWA</title>

        <link rel="manifest" href="/static/manifest.json">
        <meta name="theme-color" content="#efeef3">

        <!-- Instalação em iOS: o Safari não lê o manifest.json para isso,
             precisa destas tags específicas. -->
        <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="default">
        <meta name="apple-mobile-web-app-title" content="SmartCat">

        <!-- Compatibilidade extra em Android/Chrome mais antigos -->
        <meta name="mobile-web-app-capable" content="yes">

        <!-- A UI usa a fonte do sistema (-apple-system/SF Pro) no macOS/iOS.
             Inter e JetBrains Mono entram só como fallback em outras plataformas. -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="/static/css/style.css?v=4">
    </head>
    <body>

        <header class="navbar">
            <div class="navbar-brand">
                <svg class="logo-mark" width="30" height="19" viewBox="0 0 32 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M1 10C1 10 7 2 16 2C25 2 31 10 31 10C31 10 25 18 16 18C7 18 1 10 1 10Z" stroke="currentColor" stroke-width="1.5"/>
                    <ellipse cx="16" cy="10" rx="2.1" ry="6" fill="currentColor"/>
                </svg>
                <h1>SmartCat</h1>
            </div>
            <div class="navbar-actions">
                <button id="btn-instalar-app" class="btn-notif hidden">⬇️ Instalar app</button>
                <button id="btn-ativar-notificacoes" class="btn-notif">🔕 Ativar notificações</button>
                <span id="status-badge" class="badge">Conectado</span>
            </div>
        </header>

        <main class="container">
            <!-- Seção de Alertas de Saúde -->
            <section class="card">
                <div class="card-header">
                    <h2>🚨 Alertas de Saúde</h2>
                    <span id="alertas-count-badge" class="badge badge-alerta hidden">0</span>
                </div>
                <ul id="lista-alertas" class="feed-list">Carregando alertas...</ul>
            </section>

            <!-- Seção de Pets com Botão Adicionar -->
            <section class="card">
                <div class="card-header">
                    <h2>Meus Pets Cadastrados</h2>
                    <button id="btn-abrir-modal" class="btn-primary">+ Novo Pet</button>
                </div>
                <div id="lista-gatos">Carregando gatos...</div>
            </section>

            <!-- Seção de Dispositivos / Estações IoT -->
            <section class="card">
                <div class="card-header">
                    <h2>📡 Estações IoT Conectadas</h2>
                    <button id="btn-abrir-modal-estacao" class="btn-primary">+ Nova Estação</button>
                </div>
                <div id="lista-estacoes">Carregando estações...</div>
            </section>

            <!-- Seção de Histórico -->
            <section class="card">
                <div class="card-header">
                    <h2>Atividade Recente</h2>
                </div>
                <ul id="lista-eventos" class="feed-list">Carregando atividade...</ul>
            </section>
        </main>


        <!-- MODAL DE CADASTRO / EDIÇÃO DE PET -->
        <div id="modal-gato" class="modal-overlay hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="modal-titulo">Cadastrar Novo Pet</h3>
                    <button id="btn-fechar-modal" class="btn-close" type="button">&times;</button>
                </div>

                <form id="form-gato">
                    <div class="form-group">
                        <label for="tag_rfid">Tag RFID (Coleira):</label>
                        <input type="text" id="tag_rfid" placeholder="Ex: A1B2C3D4" required>
                    </div>

                    <div class="form-group">
                        <label for="nome">Nome do Pet:</label>
                        <input type="text" id="nome" placeholder="Ex: Luna" required>
                    </div>

                    <div class="form-group">
                        <label for="data_nascimento">Data de Nascimento:</label>
                        <input type="date" id="data_nascimento" required>
                    </div>

                    <div class="form-group">
                        <label for="peso_meta_g">Meta de Peso (gramas):</label>
                        <input type="number" id="peso_meta_g" placeholder="Ex: 4000" value="4000">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="limite_jejum_horas">Alerta Jejum (h):</label>
                            <input type="number" id="limite_jejum_horas" value="24" required>
                        </div>
                        <div class="form-group">
                            <label for="limite_caixa_segundos">Alerta Caixa (s):</label>
                            <input type="number" id="limite_caixa_segundos" value="300" required>
                        </div>
                    </div>

                    <button type="submit" id="btn-salvar-gato" class="btn-submit">Salvar Pet</button>
                </form>
            </div>
        </div>

        <!-- MODAL DE VÍNCULO DE ESTAÇÃO -->
        <div id="modal-estacao" class="modal-overlay hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="modal-estacao-titulo">Vincular Estação IoT</h3>
                    <button id="btn-fechar-modal-estacao" class="btn-close" type="button">&times;</button>
                </div>

                <form id="form-estacao">
                    <div class="form-group">
                        <label for="mac_address">ID do Hardware (MAC Address):</label>
                        <input type="text" id="mac_address" placeholder="Ex: ESP32_240AC4000110" required>
                    </div>

                    <div class="form-group">
                        <label for="nome_estacao">Nome do Local/Aparelho:</label>
                        <input type="text" id="nome_estacao" placeholder="Ex: Pote de Comida da Sala" required>
                    </div>

                    <div class="form-group">
                        <label for="tipo_estacao">Função da Estação:</label>
                        <select id="tipo_estacao" class="select-field" required>
                            <option value="COMIDA">🥣 Alimentador (Pote de Comida)</option>
                            <option value="CAIXA">📦 Sanitário (Caixa de Areia)</option>
                        </select>
                    </div>

                    <button type="submit" class="btn-submit">Salvar Estação</button>
                </form>
            </div>
        </div>

        <script src="/static/js/push.js?v=1"></script>
        <script src="/static/js/app.js?v=5"></script>
    </body>
</html>
