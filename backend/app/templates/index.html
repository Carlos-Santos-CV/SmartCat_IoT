<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SmartCat PWA</title>

        <link rel="manifest" href="/static/manifest.json">
        <meta name="theme-color" content="#2563eb">
        <link rel="stylesheet" href="/static/css/style.css?v=2">
    </head>
    <body>

        <header class="navbar">
            <h1>🐱 SmartCat</h1>
            <span id="status-badge" class="badge">Conectado</span>
        </header>

        <main
            class="container">
            <!-- Seção de Pets com Botão Adicionar -->
            <section class="card">
                <div class="card-header">
                    <h2>Meus Pets Cadastrados</h2>
                    <button id="btn-abrir-modal" class="btn-primary">+ Novo Pet</button>
                </div>
                <div id="lista-gatos">Carregando gatos...</div>
            </section>

            <!-- Seção de Histórico -->
            <section class="card">
                <h2>Últimas Refeições</h2>
                <ul id="lista-refeicoes" class="feed-list">Carregando refeições...</ul>
            </section>
        </main>


        <!-- MODAL DE CADASTRO / EDIÇÃO DE PET -->
        <div id="modal-gato" class="modal-overlay hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="modal-titulo">Cadastrar Novo Pet</h3>
                    <button id="btn-fechar-modal" class="btn-close" type="button">&times;</button>
                </div>

                <form id="form-gato">
                    <div class="form-group">
                        <label for="tag_rfid">Tag RFID (Coleira):</label>
                        <input type="text" id="tag_rfid" placeholder="Ex: A1B2C3D4" required>
                    </div>

                    <div class="form-group">
                        <label for="nome">Nome do Pet:</label>
                        <input type="text" id="nome" placeholder="Ex: Luna" required>
                    </div>

                    <div class="form-group">
                        <label for="data_nascimento">Data de Nascimento:</label>
                        <input type="date" id="data_nascimento" required>
                    </div>

                    <div class="form-group">
                        <label for="peso_meta_g">Meta de Peso (gramas):</label>
                        <input type="number" id="peso_meta_g" placeholder="Ex: 4000" value="4000">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="limite_jejum_horas">Alerta Jejum (h):</label>
                            <input type="number" id="limite_jejum_horas" value="24" required>
                        </div>
                        <div class="form-group">
                            <label for="limite_caixa_segundos">Alerta Caixa (s):</label>
                            <input type="number" id="limite_caixa_segundos" value="300" required>
                        </div>
                    </div>

                    <button type="submit" id="btn-salvar-gato" class="btn-submit">Salvar Pet</button>
                </form>
            </div>
        </div>

        <script src="/static/js/app.js?v=2"></script>
    </body>
</html>
